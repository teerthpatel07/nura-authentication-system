<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | NURA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

</head>

<body>


<div class="auth-page">

    <div class="auth-left">

        <div>

            <div class="brand-logo mb-4">
                N
            </div>

            <h1>NURA</h1>

            <p>
                Secure access. Simple experience.
            </p>

            <small>
                Sign in to access your account and
                manage your profile.
            </small>

        </div>

    </div>


    <div class="auth-right">

        <div class="auth-card">

            <div class="mb-4">

                <span class="small text-primary fw-bold">
                    WELCOME BACK
                </span>

                <h2 class="mt-2">
                    Sign in to your account
                </h2>

                <p class="text-muted">
                    Enter your credentials to continue.
                </p>

            </div>


            <div id="message"></div>


            <form id="loginForm">

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100 mt-2"
                >
                    Sign In
                </button>

            </form>


            <div class="text-center mt-4">

                <span class="text-muted">
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create account
                </a>

            </div>

        </div>

    </div>

</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="assets/js/login.js"></script>


</body>

</html>
