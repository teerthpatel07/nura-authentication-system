<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile | NURA</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

</head>

<body class="profile-page">


<nav class="navbar navbar-light bg-white border-bottom">

    <div class="container">

        <a
            href="profile.html"
            class="navbar-brand fw-bold"
        >
            NURA
        </a>

        <button
            id="logoutBtn"
            class="btn btn-outline-danger btn-sm"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container py-5">


    <div class="mb-4">

        <span class="text-primary small fw-bold">
            ACCOUNT
        </span>

        <h1 class="mt-2">
            Your Profile
        </h1>

        <p class="text-muted">
            View and update your profile information.
        </p>

    </div>


    <div class="row g-4">


        <!-- Account information -->

        <div class="col-md-5">

            <div class="card profile-card">

                <div class="card-body p-4">

                    <h4 class="mb-4">
                        Account Information
                    </h4>


                    <div class="profile-item">

                        <small>
                            Username
                        </small>

                        <strong id="username">
                            Loading...
                        </strong>

                    </div>


                    <div class="profile-item">

                        <small>
                            Email
                        </small>

                        <strong id="email">
                            Loading...
                        </strong>

                    </div>

                </div>

            </div>

        </div>


        <!-- Profile information -->

        <div class="col-md-7">

            <div class="card profile-card">

                <div class="card-body p-4">

                    <h4 class="mb-4">
                        Profile Details
                    </h4>


                    <form id="profileForm">


                        <div class="mb-3">

                            <label
                                for="full_name"
                                class="form-label"
                            >
                                Full Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="full_name"
                                name="full_name"
                                placeholder="Enter your full name"
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="phone"
                                class="form-label"
                            >
                                Phone
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="phone"
                                name="phone"
                                placeholder="Enter your phone number"
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="bio"
                                class="form-label"
                            >
                                Bio
                            </label>

                            <textarea
                                class="form-control"
                                id="bio"
                                name="bio"
                                rows="4"
                                placeholder="Tell us about yourself"
                            ></textarea>

                        </div>


                        <div id="profileMessage"></div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Profile
                        </button>

                    </form>

                </div>

            </div>

        </div>


    </div>

</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="assets/js/profile.js"></script>


</body>

</html>
